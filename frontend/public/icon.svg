<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Cat ears -->
  <path d="M140 220 L180 110 L230 200 Z" fill="url(#pink)" opacity="0.9"/>
  <path d="M282 200 L332 110 L372 220 Z" fill="url(#pink)" opacity="0.9"/>
  <!-- Inner ears -->
  <path d="M160 200 L185 135 L215 195 Z" fill="#1a1a2e" opacity="0.5"/>
  <path d="M297 195 L327 135 L352 200 Z" fill="#1a1a2e" opacity="0.5"/>
  <!-- Cat face -->
  <ellipse cx="256" cy="290" rx="130" ry="120" fill="url(#pink)" opacity="0.9"/>
  <!-- Eyes -->
  <ellipse cx="216" cy="270" rx="20" ry="24" fill="#1a1a2e"/>
  <ellipse cx="296" cy="270" rx="20" ry="24" fill="#1a1a2e"/>
  <!-- Eye shine -->
  <ellipse cx="224" cy="262" rx="7" ry="8" fill="white" opacity="0.8"/>
  <ellipse cx="304" cy="262" rx="7" ry="8" fill="white" opacity="0.8"/>
  <!-- Nose -->
  <ellipse cx="256" cy="300" rx="8" ry="6" fill="#1a1a2e" opacity="0.7"/>
  <!-- Mouth -->
  <path d="M240 308 Q256 325 272 308" fill="none" stroke="#1a1a2e" stroke-width="3" opacity="0.5"/>
  <!-- Whiskers -->
  <line x1="130" y1="280" x2="190" y2="290" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="305" x2="190" y2="300" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="322" y1="290" x2="382" y2="280" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="322" y1="300" x2="382" y2="305" stroke="white" stroke-width="2" opacity="0.3"/>
  <!-- Heart -->
  <g transform="translate(256, 400) scale(0.5)">
    <path d="M0-40 C-30-70 -80-40 -80-10 C-80 30 0 70 0 70 C0 70 80 30 80-10 C80-40 30-70 0-40Z" fill="#ec4899"/>
  </g>
</svg>
