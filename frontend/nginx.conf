server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Системный DNS резолвер (подставляется при старте из /etc/resolv.conf)
    resolver DOCKER_DNS_PLACEHOLDER valid=30s ipv6=off;

    # Проксируем API запросы на бэкенд
    # Через переменную — резолвинг происходит в момент запроса, не при старте
    location /api/ {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # SPA fallback — все роуты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ассетов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
